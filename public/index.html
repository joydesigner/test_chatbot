<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="/dist/styles.css" rel="stylesheet">
</head>

<body class="bg-gray-50">
  <div class="chat-container">
    <header class="bg-white shadow-sm p-4 rounded-lg mb-4">
      <h1 class="text-2xl font-bold text-gray-800">AI Assistant</h1>
      <p class="text-gray-600">How can I help you today?</p>
    </header>

    <div class="messages-container">
      <ul id="messages" class="space-y-4"></ul>
    </div>

    <div class="input-container">
      <div class="flex items-center gap-2 w-full">
        <div id="aiIcon" class="ai-icon" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <input type="text" id="userInput" class="message-input flex-1" placeholder="Type your message..." />
        <button onclick="sendMessage()" id="sendButton" class="send-button">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path
              d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const aiIcon = document.getElementById('aiIcon');

    socket.on('connect', () => {
      console.log('Connected to server');
    });

    socket.on('thinking', (isThinking) => {
      aiIcon.style.display = isThinking ? 'block' : 'none';
    });

    socket.on('chat response', (response) => {
      const botMessage = document.createElement('li');
      botMessage.className = 'message bot-message';
      botMessage.textContent = response;
      messages.appendChild(botMessage);
      messages.scrollTop = messages.scrollHeight;
    });

    function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      // Disable input and button while processing
      userInput.disabled = true;
      sendButton.disabled = true;

      // Add user message
      const userMessage = document.createElement('li');
      userMessage.className = 'message user-message';
      userMessage.textContent = message;
      messages.appendChild(userMessage);

      // Clear input
      userInput.value = '';

      // Send message to server
      socket.emit('chat message', message);

      // Re-enable input and button after a short delay
      setTimeout(() => {
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
      }, 100);
    }

    // Handle Enter key
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Auto-focus input on page load
    userInput.focus();
  </script>
</body>

</html>
